name: Bug report
description: Report a reproducible bug without private information
title: '[Bug] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
  - type: input
    id: platform
    attributes:
      label: Browser / OS / device class (no personal identifiers)

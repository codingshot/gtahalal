name: Mission proposal
description: Propose a nonviolent, constructive mission
title: '[Mission] '
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Player goal and interaction loop
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Quran.com / Sunnah.com source links and review status
      description: References are research leads until qualified review.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Accessibility, safety, cultural sensitivity and alternatives
